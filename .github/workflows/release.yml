name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed release tag to recover
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: ${{ github.event_name == 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Establish trusted release signer
        env:
          RELEASE_SIGNER_FINGERPRINT: ${{ vars.RELEASE_SIGNER_FINGERPRINT }}
          GNUPGHOME: ${{ runner.temp }}/zimster-release-gnupg
        run: |
          test -n "$RELEASE_SIGNER_FINGERPRINT"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          node .github/scripts/release-signing-key.mjs \
            --key .github/release-keys/william-zimmerman.asc \
            --trusted-fingerprint "$RELEASE_SIGNER_FINGERPRINT" \
            --gnupg-home "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Verify signed annotated tag and release target
        env:
          RELEASE_SIGNER_FINGERPRINT: ${{ vars.RELEASE_SIGNER_FINGERPRINT }}
        run: |
          test -n "$RELEASE_SIGNER_FINGERPRINT"
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git verify-tag "$RELEASE_TAG"
          RELEASE_COMMIT="$(git rev-parse "$RELEASE_TAG^{}")"
          if test "$GITHUB_EVENT_NAME" = "push"; then
            test "$RELEASE_COMMIT" = "$GITHUB_SHA"
          fi
          git checkout --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
          cache: npm
      - name: Establish npm Trusted Publishing runtime
        run: |
          npm install --global npm@11.5.1
          test "$(node --version)" = "v26.7.0"
          test "$(npm --version)" = "11.5.1"
      - run: npm ci
      - run: npm run check
      - run: npm run version:check -- --tag "$RELEASE_TAG"
      - name: Materialize signed release inputs
        env:
          RELEASE_SIGNER_FINGERPRINT: ${{ vars.RELEASE_SIGNER_FINGERPRINT }}
        run: |
          RELEASE_EVIDENCE_DIR="$RUNNER_TEMP/zimster-release-evidence"
          npm run release:evidence -- extract-tag \
            --tag "$RELEASE_TAG" \
            --trusted-fingerprint "$RELEASE_SIGNER_FINGERPRINT" \
            --output "$RELEASE_EVIDENCE_DIR"
          echo "RELEASE_EVIDENCE_DIR=$RELEASE_EVIDENCE_DIR" >> "$GITHUB_ENV"
      - name: Verify signed release authorization and artifact digests
        id: authorization
        env:
          RELEASE_SIGNER_FINGERPRINT: ${{ vars.RELEASE_SIGNER_FINGERPRINT }}
        run: |
          npm run release:evidence -- verify-tag \
            --tag "$RELEASE_TAG" \
            --trusted-fingerprint "$RELEASE_SIGNER_FINGERPRINT" \
            --standards-lock config/standards-lock.json \
            --semantic-review "$RELEASE_EVIDENCE_DIR/semantic-review.json" \
            --host-matrix "$RELEASE_EVIDENCE_DIR/host-matrix.json" \
            --verification "$RELEASE_EVIDENCE_DIR/verification.json" \
            --dist dist \
            --github-output "$GITHUB_OUTPUT"
      - run: npm run checksums
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.zip
            dist/*.tgz
      - name: Prepare draft GitHub release
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ steps.authorization.outputs.release_title }}
          RELEASE_PRERELEASE: ${{ steps.authorization.outputs.release_prerelease }}
        run: |
          RELEASE_ID="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id')"
          case "$RELEASE_ID" in
            *$'\n'*) echo "duplicate GitHub releases for exact target tag" >&2; exit 1 ;;
          esac
          if test -n "$RELEASE_ID"; then
            IS_DRAFT="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)"
            if test "$IS_DRAFT" = "true"; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                -f name="$RELEASE_TITLE" \
                -F draft=true \
                -F prerelease="$RELEASE_PRERELEASE" \
                -f make_latest=false >/dev/null
            fi
          else
            RELEASE_ID="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f name="$RELEASE_TITLE" \
              -F draft=true \
              -F prerelease="$RELEASE_PRERELEASE" \
              -f make_latest=false \
              -F generate_release_notes=true \
              --jq .id)"
          fi
          test -n "$RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
      - name: Publish npm package idempotently
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARTIFACT="dist/zimster-${VERSION}.tgz"
          LOCAL_SHASUM="$(sha1sum "$ARTIFACT" | cut -d ' ' -f 1)"
          PUBLISHED_SHASUM="$(npm view "zimster@${VERSION}" dist.shasum 2>/dev/null || true)"
          if test -n "$PUBLISHED_SHASUM"; then
            test "$PUBLISHED_SHASUM" = "$LOCAL_SHASUM"
          else
            npm publish "$ARTIFACT" --access public
          fi
      - name: Expose authorized GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.github_release.outputs.release_id }}
          RELEASE_TITLE: ${{ steps.authorization.outputs.release_title }}
          RELEASE_PRERELEASE: ${{ steps.authorization.outputs.release_prerelease }}
          RELEASE_LATEST: ${{ steps.authorization.outputs.release_latest }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.tgz dist/*SHA256SUMS.txt --clobber
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f name="$RELEASE_TITLE" \
            -F draft=false \
            -F prerelease="$RELEASE_PRERELEASE" \
            -f make_latest="$RELEASE_LATEST" >/dev/null
