name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify signed tag and exact target
        env:
          RELEASE_SIGNER_FINGERPRINT: ${{ vars.RELEASE_SIGNER_FINGERPRINT }}
        run: |
          test -n "$RELEASE_SIGNER_FINGERPRINT"
          git verify-tag "$GITHUB_REF_NAME"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
      - run: npm run check
      - run: npm run version:check -- --tag "$GITHUB_REF_NAME"
      - name: Verify signed release authorization and artifact digests
        env:
          RELEASE_SIGNER_FINGERPRINT: ${{ vars.RELEASE_SIGNER_FINGERPRINT }}
        run: >-
          npm run release:evidence -- verify-tag
          --tag "$GITHUB_REF_NAME"
          --trusted-fingerprint "$RELEASE_SIGNER_FINGERPRINT"
          --standards-lock config/standards-lock.json
          --semantic-review release/evidence/semantic-review.json
          --host-matrix release/evidence/host-matrix.json
          --verification release/evidence/verification.json
          --dist dist
      - run: npm run checksums
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.zip
            dist/*.tgz
      - name: Publish npm package idempotently
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACT="dist/zimster-${VERSION}.tgz"
          LOCAL_SHASUM="$(sha1sum "$ARTIFACT" | cut -d ' ' -f 1)"
          PUBLISHED_SHASUM="$(npm view "zimster@${VERSION}" dist.shasum 2>/dev/null || true)"
          if test -n "$PUBLISHED_SHASUM"; then
            test "$PUBLISHED_SHASUM" = "$LOCAL_SHASUM"
          else
            npm publish "$ARTIFACT" --access public --provenance
          fi
      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.tgz dist/*SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes dist/*.zip dist/*.tgz dist/*SHA256SUMS.txt
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
